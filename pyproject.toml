netcdf4 = "*"
hatch = ">=1.16.3,<2"
ghp-import = ">=2.1.0,<3"
pytz = ">=2025.2,<2026"
jupyter-book = "*"
typst = ">=0.15.1,<0.16"
pandoc = ">=3.14,<4"
climlab = ">=0.9.2,<0.10"
nodejs = ">=26.13.1,<26.14"

[tool.pixi.pypi-dependencies]
cloudlib = { path = "/Users/phil/repos/cloudlib", editable = true }
gen-utils = { path = "/Users/phil/repos/gen_utils", editable = true }


